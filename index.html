// ===== MAIN CALCULATION =====
function calculateChart() {
  const btn = document.getElementById('submitBtn');
  btn.classList.add('loading');
  document.getElementById('errorContainer').innerHTML = '';

  try {
    if (!window.iztro) {
      showError('命盘计算库加载中，请刷新页面后重试。如果问题持续，请检查网络连接�?);
      btn.classList.remove('loading');
      return;
    }

    const dateStr = document.getElementById('birthDate').value;
    const hourIndex = parseInt(document.getElementById('birthHour').value);
    const gender = document.getElementById('birthGender').value;

    if (!dateStr) {
      showError('请选择出生日期');
      btn.classList.remove('loading');
      return;
    }

    const parts = dateStr.split('-');
    const fmtDate = parts[0] + '-' + parseInt(parts[1]) + '-' + parseInt(parts[2]);

    let chart;
    if (calendarType === 'solar') {
      chart = window.iztro.astro.bySolar(fmtDate, hourIndex, gender, 'zh-CN');
    } else {
      chart = window.iztro.astro.byLunar(fmtDate, hourIndex, gender, isLeap, true, 'zh-CN');
    }

    if (!chart) {
      showError('排盘失败，请检查输入信息是否正确�?);
      btn.classList.remove('loading');
      return;
    }

    renderChart(chart, dateStr, hourIndex, gender);

    document.getElementById('formSection').style.display = 'none';
    document.getElementById('chartSection').classList.add('visible');
    window.scrollTo(0, 0);

  } catch (e) {
    showError('排盘出错�? + (e.message || e));
    console.error(e);
  }

  btn.classList.remove('loading');
}

// ===== PALACE GRID =====
function renderPalaceGrid(palaces, soulBranch, bodyBranch, chart, hourIndex) {
  const gridEl = document.getElementById('palaceGrid');

  // Build branch -> palace map
  const palaceMap = {};
  for (const p of palaces) {
    const branch = getBranchCN(p);
    palaceMap[branch] = p;
  }

  // Collect all mutagens from chart for center display
  const allMutagens = [];
  for (const p of palaces) {
    for (const s of (p.majorStars || []).concat(p.minorStars || [])) {
      if (s.mutagen) {
        allMutagens.push({ starName: s.name || '', mutagen: s.mutagen });
      }
    }
  }

  let html = '';
  for (let row = 0; row < 4; row++) {
    for (let col = 0; col < 4; col++) {
      const branch = GRID_BRANCHES[row][col];

      if (!branch) {
        // Center area
        if (row === 1 && col === 1) {
          const chineseDate = chart.chineseDate || '';
          let yearSB = chineseDate ? chineseDate.split(/[\s年]/)[0] || '' : '';

          const fourHuaHtml = allMutagens.map(m => {
            const cls = HUA_CLASS[m.mutagen] || '';
            return '<span class="hua-tag hua-' + cls + '">' + m.starName + HUA_CN[m.mutagen] + '</span>';
          }).join('\n');

          html += '<div class="palace-center">' +
            '<div class="center-bagua">�?/div>' +
            '<div class="center-title">' + yearSB + '生人</div>' +
            '<div class="center-info">' +
              (chart.lunarDate || '') + '<br>' +
              (chart.chineseDate || '') + '<br>' +
              (HOUR_NAMES[hourIndex] || '') + '�?· ' + FIVE_ELEMENTS_CN[chart.fiveElementsClass] +
            '</div>' +
            '<div class="four-hua-bar">' + fourHuaHtml + '</div>' +
          '</div>';
        }
        continue;
      }

      const p = palaceMap[branch];

      // CSS classes
      const cls = ['palace'];
      if (branch === soulBranch) cls.push('active');
      if (branch === bodyBranch) cls.push('current-limit');

      // Palace name (Chinese)
      let pNameCN = '';
      if (p) pNameCN = PALACE_NAMES_CN[p.name] || p.name || '';

      // Stars
      let starsHtml = '';
      if (p) {
        const majorStars = p.majorStars || [];
        const minorStars = p.minorStars || [];
        const adjStars = p.adjectiveStars || [];
        const allStars = [
          ...majorStars.map(s => ({ name: s.name || s, isMain: true, mutagen: s.mutagen || null })),
          ...minorStars.map(s => ({ name: s.name || s, isMain: false, mutagen: s.mutagen || null })),
          ...adjStars.slice(0, 3).map(s => ({ name: s.name || s, isMain: false, mutagen: null }))
        ];

        if (allStars.length > 0) {
          for (const star of allStars) {
            let extra = '';
            if (star.mutagen) {
              const mClass = HUA_CLASS[star.mutagen] || '';
              extra = ' <span class="star ' + mClass + '">' + HUA_CN[star.mutagen] + '</span>';
            }
            starsHtml += '<div class="star ' + (star.isMain ? 'main' : 'minor') + '">' + (star.name || '') + extra + '</div>';
          }
        } else {
          starsHtml = '<div class="star empty">空宫</div>';
        }
      }

      // Badges
      let badges = '';
      if (p) {
        const sp = chart.getSoulPalace ? chart.getSoulPalace() : null;
        const bp = chart.getBodyPalace ? chart.getBodyPalace() : null;
        if (sp && p.index === sp.index) badges += '<div class="palace-badge badge-ming">命宫</div>';
        if (bp && p.index === bp.index) badges += '<div class="palace-badge badge-body">身宫</div>';
      }

      html += '<div class="' + cls.join(' ') + '">' +
        '<div class="palace-name">' + pNameCN + '</div>' +
        '<div class="palace-dizhi">' + branch + '</div>' +
        '<div class="palace-stars">' + starsHtml + '</div>' +
        badges +
      '</div>';
    }
  }

  gridEl.innerHTML = html;
}

function genInterpretation(stars, palaceName) {
  if (!stars || stars.length === 0) {
    return '此宫为空宫，需借对宫星曜来看�?br>' +
      '空宫不代表没有，而是说明这个领域受外部环境影响较大，' +
      '需结合后天运势判断。建议多观察实际生活中的表现来校准�?;
  }

  const arr = Array.isArray(stars) ? stars : stars.split('�?).filter(s => s.trim());
  let parts = [];
  for (const name of arr) {
    const info = STAR_MEANINGS[name];
    if (info) {
      parts.push('<strong>' + name + '</strong>—�? + info.desc);
      if (info.advantage) parts.push('<span class="good">优势�?/span>' + info.advantage);
      if (info.risk) parts.push('<span class="warn">注意�?/span>' + info.risk);
      if (info.positive && !info.advantage) parts.push('<span class="good">正面�?/span>' + info.positive);
    } else {
      parts.push('<strong>' + name + '</strong>�? + palaceName + '，需结合其他星曜综合判断�?);
    }
  }
  return parts.join('<br>');
}
